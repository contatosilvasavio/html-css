<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabelas com mesclagem e escopo</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: separate;
            text-align: center;
            width: 100%;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
        }
        
    </style>
</head>
<body>
    <table>            
        <tbody>
             <tr>
                <td scope="row">1</td>
                <td scope="row">2</td>
                <td rowspan="2">3</td>
                <td scope="row">4</td>
            </tr>
            <tr>
                <td scope="row">5</td>
                <td scope="row">6</td>
                <td scope="row">7</td>
            </tr>
            <tr>
                <td colspan="3">8</td>
                <td scope="row">9</td>
            <tr>
                <td rowspan="2">10</td>
                <td colspan="2">11</td>                
                <td scope="row">12</td>
            </tr>
            <tr>
                <td scope="row">13</td>
                <td scope="row">14</td>
                <td scope="row">15</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
