<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabelas com mesclagem e escopo</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: separate;
            text-align: center;
            width: 100%;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
        }
        
    </style>
</head>
<body>
    <table>            
        <tbody>
             <tr>
                <td colspan="4">A</td>
                <td rowspan="4">B</td>
            </tr>
            <tr>
                <td rowspan="4">C</td>
                <td scope="row">D</td>
                <td scope="row">E</td>
                <td scope="row">F</td>
            </tr>
            <tr>
                <td scope="row">G</td>
                <td scope="row">H</td>
                <td scope="row">I</td>
            </tr>
            <tr>
                <td scope="row">J</td>
                <td scope="row">K</td>
                <td scope="row">L</td>
            </tr>
            <tr>
               <td colspan="4">M</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
