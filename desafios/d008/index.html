<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>
        Em HTML5 podemos inserir elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.
    </p>
    <ul type="square">
        <li span title="Use a tag <p>">Parágrafos</li>
        <li span title="Use a tag <h>">Títulos</li>
        <li span title="Use a tag <img>">Imagens</li>
        <li span title="Use a tag <abbr>">Abreviações</li>
        <li span title="Use o atalho Ctrl+U no navegador">Códigos-fonte</li>
        <li span title="Use a tag <ul type="1">Listas numeradas</li>
        <li span title="Use as tags <dl><dt><dd>">Listas com demarcadores</li>
    </ul>
</body>
</html>
