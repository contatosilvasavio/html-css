<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
        }
        
    </style>
</head>
<body>
    <h1>Exercício de Tabelas</h1>

    <table>
        <colgroup>
            <col class="cnome"> 
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
            <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>João da Silva</td>
            <td>Masculino</td>
            <td>30</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria Oliveira</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Advogada</td>
        </tr>
        <tr>
            <td>Carlos Souza</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Médico</td>
        </tr>
        <tr>
            <td>Ana Pereira</td>
            <td>Feminino</td>
            <td>32</td>
            <td>Professora</td>
        </tr>
        <tr>
            <td>Pedro Santos</td>
            <td>Masculino</td>
            <td>27</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Juliana Costa</td>
            <td>Feminino</td>
            <td>29</td>
            <td>Arquiteta</td>
        </tr>
    </table>
</body>
</html>
