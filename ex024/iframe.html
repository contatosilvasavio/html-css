<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 440px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>O <a href="https://www.google.com" target="_blank" frameborder="0" >iframe</a> 
        
        <!-- O iframe é um elemento HTML que permite incorporar outro documento HTML dentro do documento atual. Ele é usado para exibir conteúdo de outros sites ou páginas da web sem precisar redirecionar o usuário para outra página. -->
         <!-- Tamanho padrão do iframe: 300px de largura por 150px de altura -->
        <iframe src="https://www.cursoemvideo.com" frameborder="1" height="440" scrolling="auto"></iframe>
        abaixo carrega o conteúdo de outro site dentro desta página.</p>
</body>
</html>
